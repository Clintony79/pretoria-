<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Garage | MOT • Servicing • Tyres</title>
  <style>
    :root {
      /* Colors */
      --color-obsidian: #1d1d1f;
      --color-frost-white: #f5f5f7;
      --color-pure-black: #000000;
      --color-paper-white: #ffffff;
      --color-carbon: #111111;
      --color-platinum: #86868b;
      --color-graphite: #333336;
      --color-apple-blue: #0071e3;
      --color-link-blue: #0066cc;
      --color-signal-orange: #f56900;

      /* Typography */
      --font-sf-pro-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-sf-pro-text: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* Spacing */
      --spacing-28: 28px;
      --spacing-48: 48px;
      --spacing-80: 80px;
      --spacing-96: 96px;
      --spacing-120: 120px;

      /* Border Radius */
      --radius-nav: 980px;
      --radius-cards: 28px;
      --radius-buttons: 36px;

      /* Surfaces */
      --surface-pure-black: #000000;
      --surface-obsidian: #1d1d1f;
      --surface-paper-white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sf-pro-text);
      background: var(--surface-pure-black);
      color: var(--color-frost-white);
      line-height: 1.47;
      font-size: 17px;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* === NAVIGATION === */
    nav {
      position: sticky;
      top: 20px;
      z-index: 100;
      padding: 0 24px;
      margin-bottom: -80px;
    }

    .nav-inner {
      max-width: 980px;
      margin: 0 auto;
      background: rgba(29, 29, 31, 0.7);
      backdrop-filter: saturate(180%) blur(20px);
      border-radius: var(--radius-nav);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-frost-white);
      text-decoration: none;
    }

    .nav-links a {
      color: var(--color-frost-white);
      text-decoration: none;
      font-size: 12px;
      opacity: 0.8;
      margin: 0 10px;
      transition: opacity 0.2s;
    }

    .nav-links a:hover {
      opacity: 1;
    }

    .nav-phone {
      color: var(--color-apple-blue);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    /* === HERO SECTION === */
    .hero {
      background: var(--surface-pure-black);
      padding: 140px 24px 160px;
      text-align: center;
    }

    .hero-eyebrow {
      color: var(--color-signal-orange);
      font-size: 21px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .hero h1 {
      font-family: var(--font-sf-pro-display);
      font-size: clamp(48px, 10vw, 80px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.24px;
      max-width: 840px;
      margin: 0 auto 24px;
    }

    .hero p {
      font-size: 24px;
      color: var(--color-platinum);
      max-width: 640px;
      margin: 0 auto 48px;
      line-height: 1.21;
    }

    .hero-buttons {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--color-apple-blue);
      color: white;
      font-size: 17px;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: var(--radius-buttons);
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-primary:hover {
      transform: scale(1.02);
    }

    .btn-secondary {
      background: transparent;
      color: var(--color-apple-blue);
      font-size: 17px;
      font-weight: 400;
      padding: 14px 28px;
      border-radius: var(--radius-buttons);
      text-decoration: none;
      border: 1px solid var(--color-apple-blue);
    }

    /* === SECTION BASE === */...
